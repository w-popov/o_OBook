<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.ico" />

    <title>o_OBook</title>
     <script type="text/javascript">
      // Скрипт восстанавливает URL из параметров запроса до загрузки роутера
      (function(l) {
        if (l.search[1] === 'p') {
          var s = l.search.slice(1).split('&').reduce(function (q, v) {
            var p = v.split('=');
            q[p[0]] = p.slice(1).join('=').replace(/~and~/g, '&');
            return q;
          }, {});
          if (s.p !== undefined) {
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + (s.p ? '/' + s.p : '') + (s.q ? ('?' + s.q) : '') + l.hash);
          }
        }
      }(window.location));
    </script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="src/o_OBook.ts"></script>
  </head>

  </body>
</html>
